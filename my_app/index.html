      if (min && tierScore(h.tier) < min) return false;
      if (q && (h.name + " " + h.note).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function byName(a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; }
  function sortHeroes(list, key) {
    return list.slice().sort(function (a, b) {
      var c = 0;
      if (key === "tier") c = tierScore(b.tier) - tierScore(a.tier) || RARITY_ORDER.indexOf(a.rarity) - RARITY_ORDER.indexOf(b.rarity);
      else if (key === "rarity") c = RARITY_ORDER.indexOf(a.rarity) - RARITY_ORDER.indexOf(b.rarity) || tierScore(b.tier) - tierScore(a.tier);
      return c || byName(a, b);
    });
  }

  /* 티어 × 병종 그룹: { "S+": { 보병:[...], 전차:[...], 헬기:[...] }, ... } */
  function tierGrid(list) {
    var g = {};
    TIER_ORDER.forEach(function (t) { g[t] = {}; CLASSES.forEach(function (c) { g[t][c] = []; }); });
    sortHeroes(list, "rarity").forEach(function (h) { if (g[h.tier] && g[h.tier][h.class]) g[h.tier][h.class].push(h); });
    return g;
  }

  function countBy(list, key, keys) {
    var o = {}; keys.forEach(function (k) { o[k] = 0; });
    list.forEach(function (h) { if (h[key] in o) o[h[key]]++; });
    return o;
  }
  /* 행 키 × 열 키 교차 집계 */
  function crossTab(list, rowKey, rowKeys, colKey, colKeys) {
    var o = {};
    rowKeys.forEach(function (r) { o[r] = countBy(list.filter(function (h) { return h[rowKey] === r; }), colKey, colKeys); });
    return o;
  }
  function avgTierByClass(list) {
    var o = {};
    CLASSES.forEach(function (c) {
      var hs = list.filter(function (h) { return h.class === c; });
      var s = hs.reduce(function (a, h) { return a + tierScore(h.tier); }, 0);
      o[c] = hs.length ? Math.round(s / hs.length * 100) / 100 : 0;
    });
    return o;
  }
  function related(list, hero) {
    return sortHeroes(list.filter(function (h) { return h.name !== hero.name && h.class === hero.class && h.tier === hero.tier; }), "rarity");
  }
  function validate(list) {
    var errs = [], seen = {};
    list.forEach(function (h) {
      if (seen[h.name]) errs.push("중복: " + h.name); seen[h.name] = 1;
      if (RARITY_ORDER.indexOf(h.rarity) < 0) errs.push(h.name + " rarity");
      if (CLASSES.indexOf(h.class) < 0) errs.push(h.name + " class");
      if (ROLES.indexOf(h.role) < 0) errs.push(h.name + " role");
      if (TIER_ORDER.indexOf(h.tier) < 0) errs.push(h.name + " tier");
      if (!h.note) errs.push(h.name + " note");
    });
    return errs;
  }

  return { TIER_ORDER: TIER_ORDER, RARITY_ORDER: RARITY_ORDER, CLASSES: CLASSES, ROLES: ROLES,
    tierScore: tierScore, filterHeroes: filterHeroes, sortHeroes: sortHeroes, tierGrid: tierGrid,
    countBy: countBy, crossTab: crossTab, avgTierByClass: avgTierByClass, related: related, validate: validate };
})();
/* LOGIC-END */
</script>

<script>
(function () {

    "전차": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="13" width="18" height="6" rx="3"/><path d="M7 13V9h8v4M15 10h6"/></svg>',
    "헬기": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18M12 5v4"/><path d="M5 13a5 4 0 0 1 10 0v2H5z"/><path d="M15 13h6M8 18h6"/></svg>'
  };
  function tierCls(t) { var s = Logic.tierScore(t); return s >= 7 ? "t1" : s >= 5 ? "t2" : s >= 3 ? "t3" : "t4"; }
  function rar(r) { return '<span class="rar rar-' + r + '">' + r + "</span>"; }

  /* ── 상태 ── */
  var F = { rarity: [], cls: [], role: [], tier: [], minTier: "", q: "", sort: "tier", layout: "cards" };
  function clearFilters() { F.rarity = []; F.cls = []; F.role = []; F.tier = []; F.minTier = ""; F.q = ""; }
  var tierRarity = [];

  /* ── ① 영웅 도감 ── */
  function chips(group, values, labels) {

  function renderHeroes(app) {

          '<button class="btn" id="f-reset" type="button">초기화</button></div>' +
      "</section>" +
      '<section class="panel"><div class="panel-head"><div class="frow">' +
          '<label class="sub" for="f-sort">정렬</label><select id="f-sort"><option value="tier">티어순</option><option value="rarity">등급순</option><option value="name">이름순</option></select>' +
          '<div class="seg" role="group" aria-label="보기 방식"><button type="button" data-layout="cards" aria-pressed="' + (F.layout === "cards") + '">카드</button><button type="button" data-layout="table" aria-pressed="' + (F.layout === "table") + '">표</button></div>' +

  }
  function list() {
    var rows = Logic.sortHeroes(Logic.filterHeroes(HEROES, F), F.sort);

          '<div class="note">' + esc(h.note) + "</div></button>";
      }).join("") + "</div>";
    } else {
      box.innerHTML = '<div class="table-scroll"><table><thead><tr><th>이름</th><th>등급</th><th>병종</th><th>역할</th><th>티어</th><th>특징</th></tr></thead><tbody>' +
        rows.map(function (h) {
          return '<tr data-hero="' + esc(h.name) + '" tabindex="0"><td><b>' + esc(h.name) + "</b></td><td>" + rar(h.rarity) + "</td><td>" + cls(h.class) + "</td><td>" + h.role + "</td><td>" + tier(h.tier) + "</td><td>" + esc(h.note) + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }
  }

  /* ── ② 티어표 ── */
  function renderTiers(app) {
    var g = Logic.tierGrid(HEROES);
    var dim = function (h) { return tierRarity.length && tierRarity.indexOf(h.rarity) < 0; };
    var m = '<div class="corner"></div>' + Logic.CLASSES.map(function (c) { return '<div class="mh">' + cls(c) + "</div>"; }).join("");
    Logic.TIER_ORDER.forEach(function (t) {
      m += '<div class="mh mt">' + tier(t) + "</div>";
      Logic.CLASSES.forEach(function (c) { m += "<div>" + g[t][c].map(function (h) { return hchip(h, dim(h)); }).join("") + "</div>"; });
    });
    var mobile = Logic.CLASSES.map(function (c) {
      return "<div><h3>" + cls(c) + "</h3>" + Logic.TIER_ORDER.filter(function (t) { return g[t][c].length; }).map(function (t) {
        return '<div class="tl-row">' + tier(t) + "<div>" + g[t][c].map(function (h) { return hchip(h, dim(h)); }).join("") + "</div></div>";
      }).join("") + "</div>";
    }).join("");
    app.innerHTML = '<section class="panel"><div class="panel-head"><h2>티어 × 병종</h2>' +
      '<div class="frow"><span class="sub">등급 강조</span>' + Logic.RARITY_ORDER.map(function (r) {
        return '<button type="button" class="chip" data-tr="' + r + '" aria-pressed="' + (tierRarity.indexOf(r) >= 0) + '">' + r + "</button>";
      }).join("") + "</div></div>" +
      '<div class="matrix-scroll"><div class="matrix">' + m + '</div></div><div class="tier-list">' + mobile + "</div>" +
      '<p class="sub" style="margin:12px 0 0">칩 테두리 색은 등급(UR·SSR·SR)입니다. 영웅을 누르면 상세 정보가 열립니다.</p></section>';
    $$("[data-tr]", app).forEach(function (b) {
      b.addEventListener("click", function () {
        var r = b.dataset.tr, i = tierRarity.indexOf(r);
        if (i >= 0) tierRarity.splice(i, 1); else tierRarity.push(r);
        renderTiers(app);
      });
    });
  }

  /* ── ③ 분포 차트 ── */
  function renderStats(app) {
    var anim = !animated.stats && !REDUCED; animated.stats = true;
    var rc = Logic.countBy(HEROES, "rarity", Logic.RARITY_ORDER);
    var byClass = Logic.crossTab(HEROES, "class", Logic.CLASSES, "rarity", Logic.RARITY_ORDER);
    var byTier = Logic.crossTab(HEROES, "tier", Logic.TIER_ORDER, "rarity", Logic.RARITY_ORDER);
    var roles = Logic.countBy(HEROES, "role", Logic.ROLES);
    var avg = Logic.avgTierByClass(HEROES);
    var n = HEROES.length;

    function stack(rows, keyName, max) {
      return '<div class="sbars">' + Object.keys(rows).map(function (k) {
        var r = rows[k], tot = Logic.RARITY_ORDER.reduce(function (a, x) { return a + r[x]; }, 0);
        var label = keyName === "tier" ? tier(k) : cls(k);
        return '<div class="sbar">' + label + '<div class="strack">' + Logic.RARITY_ORDER.filter(function (x) { return r[x]; }).map(function (x) {
          return '<button type="button" class="sseg seg-' + x + '" style="width:' + (r[x] / max * 100) + '%" data-grow data-' + keyName + '="' + esc(k) + '" data-rarity="' + x + '" title="' + esc(k) + " · " + x + " " + r[x] + '명" aria-label="' + esc(k) + " " + x + " " + r[x] + '명, 도감에서 보기"></button>';
        }).join("") + '</div><span class="num">' + tot + "</span></div>";
      }).join("") + "</div>";
    }
    var legend = '<div class="legend">' + Logic.RARITY_ORDER.map(function (x) { return '<span><i class="seg-' + x + '"></i>' + x + "</span>"; }).join("") + "<span>막대를 누르면 도감에서 해당 영웅을 봅니다</span></div>";
    var maxClass = Math.max.apply(null, Logic.CLASSES.map(function (c) { return Logic.RARITY_ORDER.reduce(function (a, x) { return a + byClass[c][x]; }, 0); }));
    var maxTier = Math.max.apply(null, Logic.TIER_ORDER.map(function (t) { return Logic.RARITY_ORDER.reduce(function (a, x) { return a + byTier[t][x]; }, 0); }));

    var R = 52, C = 2 * Math.PI * R, acc = 0, rcol = { "공격": "var(--r-ur)", "방어": "var(--accent)", "버프": "var(--r-ssr)" };
    var arcs = Logic.ROLES.map(function (r) {
      var len = roles[r] / n * C, s = '<circle class="arc" cx="75" cy="75" r="' + R + '" stroke="' + rcol[r] + '" stroke-dasharray="' + (anim ? "0 " + C : len + " " + (C - len)) + '" data-dash="' + len + " " + (C - len) + '" stroke-dashoffset="' + (-acc) + '" transform="rotate(-90 75 75)" data-role="' + r + '"><title>' + r + " " + roles[r] + "명</title></circle>";
      acc += len; return s;
    }).join("");

    app.innerHTML =
      '<section class="kpis" aria-label="요약">' +
        '<div class="kpi"><div class="l">전체 영웅</div><div class="v"><span data-count="' + n + '">' + n + "</span><small>명</small></div></div>" +
        Logic.RARITY_ORDER.map(function (x) { return '<div class="kpi"><div class="l">' + rar(x) + '</div><div class="v"><span data-count="' + rc[x] + '">' + rc[x] + "</span><small>명</small></div></div>"; }).join("") +
        '<div class="kpi"><div class="l">S+ 티어</div><div class="v"><span data-count="' + Logic.filterHeroes(HEROES, { minTier: "S+" }).length + '">' + Logic.filterHeroes(HEROES, { minTier: "S+" }).length + "</span><small>명</small></div></div>" +
      "</section>" +
      '<div class="grid-2">' +
        '<section class="panel"><div class="panel-head"><h2>병종별 등급 구성</h2><span class="sub">단위: 명</span></div>' + stack(byClass, "cls", maxClass) + legend + "</section>" +
        '<section class="panel"><div class="panel-head"><h2>티어 분포</h2><span class="sub">S+ → D, 등급별 누적</span></div>' + stack(byTier, "tier", maxTier) + legend + "</section>" +
        '<section class="panel"><div class="panel-head"><h2>역할 비율</h2><span class="sub">출처 분류 기준</span></div><div class="donut-wrap"><svg class="donut" viewBox="0 0 150 150" role="img" aria-label="역할 비율"><circle cx="75" cy="75" r="' + R + '" fill="none" stroke="var(--surface-2)" stroke-width="20"></circle>' + arcs +
          '<text x="75" y="80" text-anchor="middle" font-size="22" font-weight="700">' + n + '명</text></svg><div class="rlist">' +
          Logic.ROLES.map(function (r) { return '<button type="button" data-role="' + r + '"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + rcol[r] + '"></i>' + r + ' <b class="num">' + roles[r] + '</b><span class="sub">' + Math.round(roles[r] / n * 100) + "%</span></button>"; }).join("") +
        "</div></div></section>" +
        '<section class="panel"><div class="panel-head"><h2>병종별 평균 티어 점수</h2><span class="sub">S+=8 · S=7 · A+=6 · A=5 · B+=4 · B=3 · C+=2 · D=1</span></div><div class="avg">' +
          Logic.CLASSES.map(function (c) { return '<div class="avg-row">' + cls(c) + '<div class="avg-track"><div class="avg-fill" data-grow style="width:' + (avg[c] / 8 * 100) + '%"></div></div><b class="num">' + avg[c].toFixed(2) + "</b></div>"; }).join("") +
          '<div class="scale"><div></div><div><span>0</span><span>4</span><span>8</span></div><div></div></div>' +
        "</div></section>" +
      "</div>";

    if (anim) {
      $$("[data-grow]", app).forEach(function (el) { el.style.transform = "scaleX(0)"; });
      $$("[data-count]", app).forEach(function (el) {
        var to = +el.dataset.count, t0 = performance.now();
        (function step(now) { var k = Math.min(1, (now - t0) / 600); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); })(t0);
      });
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        $$("[data-grow]", app).forEach(function (el) { el.style.transform = ""; });
        $$("circle[data-dash]", app).forEach(function (c) { c.setAttribute("stroke-dasharray", c.dataset.dash); });
      }); });
    }
    app.addEventListener("click", function (e) {
      var t = e.target.closest("[data-rarity],[data-role]"); if (!t) return;
      clearFilters();
      if (t.dataset.rarity) F.rarity = [t.dataset.rarity];
      if (t.dataset.cls) F.cls = [t.dataset.cls];
      if (t.dataset.role) F.role = [t.dataset.role];
      if (t.dataset.tier) F.tier = [t.dataset.tier];
      location.hash = "#heroes";
    });
  }

  /* ── 상세 패널 ── */
  var lastFocus = null;
  function openDetail(name) {
    var h = BY_NAME[name]; if (!h) return;
    lastFocus = document.activeElement;
    var rel = Logic.related(HEROES, h);
    $("#detail-root").innerHTML = '<div class="scrim" data-close></div><aside class="detail" role="dialog" aria-modal="true" aria-label="' + esc(h.name) + ' 상세">' +
      '<button type="button" class="btn close" data-close>닫기 ✕</button>' +
      '<div style="display:flex;gap:12px;align-items:center"><div class="av rar-' + h.rarity + '" style="width:56px;height:56px;font-size:24px">' + esc(h.name[0]) + '</div><div><div class="dname">' + esc(h.name) + "</div>" + rar(h.rarity) + "</div></div>" +
      '<dl class="dl"><dt>티어</dt><dd>' + tier(h.tier) + "</dd><dt>병종</dt><dd>" + cls(h.class) + "</dd><dt>역할</dt><dd>" + h.role + "</dd></dl>" +
      '<div class="dnote">' + esc(h.note) + "</div>" +
      '<div><div class="sub" style="margin-bottom:6px">같은 병종 · 같은 티어</div><div class="related">' + (rel.length ? rel.map(function (x) { return hchip(x); }).join("") : '<span class="sub">없음</span>') + "</div></div>" +
      '<p class="sub" style="margin:0">출처: AllClash 티어 목록 (2026-11-08 갱신). 공식 데이터가 아닙니다.</p></aside>';
    $(".detail .close").focus();
  }
  function closeDetail() { $("#detail-root").innerHTML = ""; if (lastFocus && lastFocus.isConnected) lastFocus.focus(); }
  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-close]")) { closeDetail(); return; }
    var h = e.target.closest("[data-hero]"); if (h) openDetail(h.dataset.hero);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && $(".detail")) closeDetail();
    if (e.key === "Enter" && e.target.matches("tr[data-hero]")) openDetail(e.target.dataset.hero);
  });

  /* ── 라우팅 ── */
  var VIEWS = { heroes: renderHeroes, tiers: renderTiers, stats: renderStats };
  function route() {
    var v = (location.hash || "").slice(1); if (!VIEWS[v]) v = "heroes";
    $$(".tabs a").forEach(function (a) { if (a.dataset.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    var app = $("#app"), wrap = document.createElement("div"); wrap.className = "view";
    app.innerHTML = ""; app.appendChild(wrap);
    VIEWS[v](wrap);
  }
  window.addEventListener("hashchange", route);

  /* ── 다크모드 ── */
  function isDark() { var t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
  function paint() { $("#theme-toggle").textContent = isDark() ? "☀️ 라이트" : "🌙 다크"; }
  try { var s = localStorage.getItem("topforce-theme"); if (s) document.documentElement.setAttribute("data-theme", s); } catch (e) {}
  $("#theme-toggle").addEventListener("click", function () {
    var n = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n);
    try { localStorage.setItem("topforce-theme", n); } catch (e) {}
    paint();
  });

  paint(); route();
})();
</script>
